name: Publicar Reels

on:
  schedule:
    - cron: "*/15 * * * *"   # cada 15 minutos (GitHub puede retrasarlo unos minutos)
  workflow_dispatch: {}      # boton "Run workflow" para ejecutarlo a mano

permissions:
  contents: write

concurrency:
  group: publicador
  cancel-in-progress: false

jobs:
  ciclo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ciclo (agendar, publicar, medir)
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GRAPH_VERSION: ${{ secrets.GRAPH_VERSION }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python nube/ciclo.py
      - name: Guardar calendario y metricas
        run: |
          git config user.name "publicador-caminos-divinos"
          git config user.email "publicador@users.noreply.github.com"
          git add -A .
          if ! git diff --cached --quiet; then
            git commit -m "Actualiza calendario y metricas"
            git pull --rebase
            git push
          fi
