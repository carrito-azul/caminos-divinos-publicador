name: Investigar referentes

on:
  schedule:
    - cron: "17 10 * * 1"   # lunes 5:17 am Bogota
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publicador
  cancel-in-progress: false

jobs:
  investigar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Revisar cuentas referentes
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GRAPH_VERSION: ${{ secrets.GRAPH_VERSION }}
        run: python nube/investigar.py
      - name: Guardar resultados
        run: |
          git config user.name "publicador-caminos-divinos"
          git config user.email "publicador@users.noreply.github.com"
          git add investigacion
          if ! git diff --cached --quiet; then
            git commit -m "Investigacion semanal"
            git pull --rebase
            git push
          fi
