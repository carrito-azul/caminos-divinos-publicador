name: Prueba de descarga (no publica)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prueba
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GRAPH_VERSION: ${{ secrets.GRAPH_VERSION }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python nube/prueba_descarga.py
      - name: Guardar registro
        run: |
          git config user.name "publicador-caminos-divinos"
          git config user.email "publicador@users.noreply.github.com"
          git add -A .
          if ! git diff --cached --quiet; then git commit -m "Prueba de descarga"; git pull --rebase; git push; fi
